name: Build Android Release Bundle (.aab)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies & build web project
        run: |
          npm ci || npm install
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore (if secret is configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-upload.jks
            echo "Keystore successfully decoded to android/app/release-upload.jks"
          else
            echo "Notice: KEYSTORE_BASE64 secret not found. Building unsigned bundle."
          fi

      - name: Build Android Release App Bundle (.aab)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign Android App Bundle (if keystore was decoded)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'accrual' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "android/app/release-upload.jks" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Signing Android App Bundle with jarsigner..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore android/app/release-upload.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              "$AAB_FILE" "$KEY_ALIAS"
            echo "Signing complete!"
            cp "$AAB_FILE" "Accrual-v1.2.0-signed.aab"
          else
            echo "No keystore provided; publishing unsigned bundle as Accrual-v1.2.0-unsigned.aab"
            cp "$AAB_FILE" "Accrual-v1.2.0-unsigned.aab"
          fi

      - name: Upload Signed .aab as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Accrual-Android-Release-Bundle
          path: |
            Accrual-v1.2.0-signed.aab
            Accrual-v1.2.0-unsigned.aab
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14
