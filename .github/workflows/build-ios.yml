name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build web project
        run: |
          npm ci || npm install
          npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install ldid for fake-signing
        run: |
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install ldid || true

      - name: Setup CodeSign bypass wrapper
        run: |
          mkdir -p /tmp/codesign-bin
          cat << 'EOF' > /tmp/codesign-bin/codesign
          #!/bin/bash
          if [[ "$*" == *"--version"* ]]; then
            /usr/bin/codesign "$@"
            exit $?
          fi
          echo "Bypassing codesign for: ${@: -1}"
          /usr/bin/codesign --force --sign - "${@: -1}" 2>/dev/null || true
          exit 0
          EOF
          chmod +x /tmp/codesign-bin/codesign

      - name: Archive and Package iOS App
        run: |
          export PATH="/tmp/codesign-bin:$PATH"
          cd ios/App
          
          # Resolve SPM packages
          xcodebuild -resolvePackageDependencies -project App.xcodeproj || true
          
          # Archive App.xcarchive with complete embedded frameworks
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            -xcconfig ../release.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || true
          
          # Locate App.app
          if [ -d "App.xcarchive/Products/Applications/App.app" ]; then
            APP_PATH="App.xcarchive/Products/Applications/App.app"
          else
            APP_PATH=$(find . -name "App.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app was not produced!"
            grep -E "error:|fatal error:" xcodebuild.log || tail -n 100 xcodebuild.log
            exit 1
          fi
          
          echo "Successfully located App.app at: $APP_PATH"
          
          # Ensure executable permissions
          chmod -R 755 "$APP_PATH"
          if [ -f "$APP_PATH/App" ]; then
            chmod +x "$APP_PATH/App"
          fi
          
          # Apply ldid fake signature
          if command -v ldid &> /dev/null; then
            echo "Applying ldid fake-signature..."
            ldid -S "$APP_PATH/App" 2>/dev/null || ldid -S "$APP_PATH" 2>/dev/null || true
          fi
          
          # Package strict IPA format (Payload/App.app)
          rm -rf Payload ../../Trouvaille.ipa ../../Trouvaille-unsigned.ipa
          mkdir -p Payload
          cp -RP "$APP_PATH" Payload/
          zip -qry ../../Trouvaille.ipa Payload
          cp ../../Trouvaille.ipa ../../Trouvaille-unsigned.ipa
          
          echo "Created IPA: $(ls -lh ../../Trouvaille.ipa)"

      - name: Upload .ipa as GitHub Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: trouvaille-unsigned-ipa
          path: Trouvaille.ipa
          if-no-files-found: warn
          retention-days: 1

      - name: Publish Direct .ipa Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Trouvaille iOS Unsigned IPA (Latest Build)"
          draft: false
          prerelease: false
          overwrite: true
          make_latest: true
          body: |
            ### Trouvaille iOS Native App (.ipa)
            **Commit**: `${{ github.sha }}`
            Direct download for AltStore / Sideloadly / LiveContainer:
            - Tap **Trouvaille.ipa** below in Safari on your iPhone.
            - Open in **AltStore** to install and re-sign with your Apple ID.
          files: |
            Trouvaille.ipa
            Trouvaille-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
