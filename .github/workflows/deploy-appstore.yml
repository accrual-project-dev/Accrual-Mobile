name: Deploy iOS to App Store (TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Nomor build kustom (opsional, default: nomor run GitHub)'
        required: false
        default: ''
      skip_upload:
        description: 'Lewati unggah ke TestFlight (hanya buat & simpan berkas .ipa)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode Toolchain
        run: |
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://iqjcmqkgrfmopznrfikx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxamNtcWtncmZtb3B6bnJmaWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODA0NzcsImV4cCI6MjEwMjg1NjQ3N30.ujfATs0huUkR9tCNB0Rs8JlqJG3dkz13EKtkr-eFiDg' }}
          VITE_REVENUECAT_APPLE_KEY: ${{ secrets.VITE_REVENUECAT_APPLE_KEY || 'appl_rmACsDjQHgRalDqlnwYGRlMTMVa' }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          sed -i '' 's/exact: "8.5.[0-9]"/from: "8.5.0"/g' ios/App/CapApp-SPM/Package.swift || true

      - name: Set iOS Build Number
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "Mengatur CFBundleVersion ke: $BUILD_NUM"
          cd ios/App
          agvtool new-version -all "$BUILD_NUM" || true
          cd ../..

      - name: Setup Temporary Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/build_cert.p12"
          if ! security import "$RUNNER_TEMP/build_cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "Format PKCS#12 modern terdeteksi, mengonversi ke format legacy untuk macOS Keychain..."
            openssl pkcs12 -in "$RUNNER_TEMP/build_cert.p12" -passin pass:"$P12_PASSWORD" -nodes -out "$RUNNER_TEMP/temp.pem"
            openssl pkcs12 -export -in "$RUNNER_TEMP/temp.pem" -passout pass:"$P12_PASSWORD" -out "$RUNNER_TEMP/build_cert_legacy.p12" -legacy
            security import "$RUNNER_TEMP/build_cert_legacy.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$RUNNER_TEMP/temp.pem" "$RUNNER_TEMP/build_cert_legacy.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install Apple Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
          echo "Terpasang Profile UUID: $PROFILE_UUID"
          
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"

      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
          echo "Nama Profil: $PROFILE_NAME"

          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.syntheticae.accrual</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive Xcode Project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj
          
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
          echo "Menyesuaikan signing settings untuk target App: $PROFILE_NAME ($APPLE_TEAM_ID)..."
          
          sed -i '' "s/DevelopmentTeam = [^;]*/DevelopmentTeam = $APPLE_TEAM_ID/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = $APPLE_TEAM_ID/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = [^;]*/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"/g" App.xcodeproj/project.pbxproj
          
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/App.xcarchive \
            -allowProvisioningUpdates \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee ../../build_archive.log

          if [ ! -d "../../build/App.xcarchive" ]; then
            echo "::error::Xcode archive gagal dibuat!"
            grep -E "error:|fatal error:" ../../build_archive.log || tail -n 60 ../../build_archive.log
            exit 1
          fi

      - name: Export .ipa Package
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build \
            -allowProvisioningUpdates

      - name: Upload .ipa as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: accrual-signed-appstore-ipa
          path: build/App.ipa
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const os = require("os");
            const keyId = (process.env.APP_STORE_CONNECT_API_KEY_ID || "").trim() || "X4SX9VQZ44";
            const issuerId = (process.env.APP_STORE_CONNECT_API_ISSUER_ID || "").trim() || "c32ee50b-c9f8-4532-898e-4c793cac57f6";
            const keyBase64 = process.env.APP_STORE_CONNECT_API_KEY_BASE64;
            if (!keyBase64) {
              console.error("ERROR: Secret APP_STORE_CONNECT_API_KEY_BASE64 tidak ditemukan!");
              process.exit(1);
            }
            const keyContent = Buffer.from(keyBase64, "base64").toString("utf8");
            
            const dirs = [
              path.join(os.homedir(), ".appstoreconnect", "private_keys"),
              path.join(os.homedir(), ".private_keys"),
              path.join(os.homedir(), "private_keys"),
              path.join(process.cwd(), "private_keys")
            ];
            
            for (const dir of dirs) {
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(path.join(dir, `AuthKey_${keyId}.p8`), keyContent);
              fs.writeFileSync(path.join(dir, "AuthKey_X4SX9VQZ44.p8"), keyContent);
            }
            console.log(`Kunci otentikasi AuthKey_${keyId}.p8 berhasil disimpan (${keyContent.length} bytes).`);
          '
          
          export API_PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_ID="${APP_STORE_CONNECT_API_KEY_ID:-X4SX9VQZ44}"
          ISSUER_ID="${APP_STORE_CONNECT_API_ISSUER_ID:-c32ee50b-c9f8-4532-898e-4c793cac57f6}"
          
          echo "Mengunggah paket aplikasi ke App Store Connect / TestFlight dengan Key ID: $KEY_ID..."
          xcrun altool --upload-package build/App.ipa \
            --type ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
            
          echo "Sukses! Aplikasi berhasil dikirim ke App Store Connect / TestFlight."

      - name: Clean Up Keychain & Keys
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/.appstoreconnect/private_keys || true
